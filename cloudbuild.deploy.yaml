# Cloud Build: build -> Artifact Registry -> Cloud Run. Nothing secret in here (names only).
# dev trigger (push develop): defaults below.
# prod trigger (push main, with "require approval"): override
#   _SERVICE=rafael  (and _MIN/_MAX if decided differently)
substitutions:
  _REGION: asia-southeast1
  _SERVICE: rafael-dev
  _REPO: rafael # Artifact Registry repo, same region
  _MIN: '1' # PROPOSAL Q2 (not decided): min = max = 1 for sprint 1, in-memory sessions
  _MAX: '1' # PROPOSAL Q2: >1 breaks resume (session affinity is best effort)
  _ALLOWED_EXTENSION_IDS: '' # chrome-extension ids (not secret), comma separated, set on the trigger
  _SECRETS: '' # ENV=SecretName:version, comma separated; empty = no app secrets (D22)
  _RUNTIME_SA: '' # runtime service account email from BE-71 (set on the trigger)
  _OAUTH_CLIENT_ID: '' # Chrome Extension OAuth client id (not secret); empty = server denies every hello
  _VERTEX_LOCATION: asia-southeast1 # GOOGLE_CLOUD_LOCATION for Gemini on Vertex (D20)
  _STT_MODEL: '' # Gemini transcribe model (BE-89); empty = no STT. Location below: these models only exist at global
  _STT_LOCATION: global
  _DETECTOR_MODEL: '' # Gemini model ids (D20), set on the trigger
  _ANSWERER_MODEL: ''
  _ALLOWED_EMAILS: '' # dev only: exact emails allowed outside praneat.com (D13 exception), comma separated; empty on prod

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/server/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rafael-server:$COMMIT_SHA', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rafael-server:$COMMIT_SHA']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # optional flags: empty _SECRETS clears secrets (D22: none needed), empty _RUNTIME_SA keeps the service's current identity
        extra=()
        if [ -n '${_SECRETS}' ]; then extra+=(--set-secrets='${_SECRETS}'); else extra+=(--clear-secrets); fi
        if [ -n '${_RUNTIME_SA}' ]; then extra+=(--service-account='${_RUNTIME_SA}'); fi
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rafael-server:$COMMIT_SHA \
          --region=${_REGION} \
          --port=8080 \
          --timeout=3600 \
          --session-affinity \
          --min-instances=${_MIN} \
          --max-instances=${_MAX} \
          --allow-unauthenticated \
          --set-env-vars='^|^ALLOWED_EXTENSION_IDS=${_ALLOWED_EXTENSION_IDS}|GOOGLE_OAUTH_CLIENT_ID=${_OAUTH_CLIENT_ID}|GOOGLE_GENAI_USE_VERTEXAI=true|GOOGLE_CLOUD_PROJECT=$PROJECT_ID|GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION}|STT_MODEL=${_STT_MODEL}|STT_LOCATION=${_STT_LOCATION}|DETECTOR_MODEL=${_DETECTOR_MODEL}|ANSWERER_MODEL=${_ANSWERER_MODEL}|ALLOWED_EMAILS=${_ALLOWED_EMAILS}' \
          --startup-probe=httpGet.path=/api/health,httpGet.port=8080 \
          --liveness-probe=httpGet.path=/api/health,httpGet.port=8080 \
          "$${extra[@]}"
        # --set-env-vars delimiter is | because emails contain @
        # --timeout=3600: WS is cut at 60 min, client reconnects + resumes
        # --allow-unauthenticated: auth is the Google token in WS hello (D13/D19, needs BE-87 verifier; until then /ws denies every hello), /api/health is open (D18)

options:
  logging: CLOUD_LOGGING_ONLY
