# Cloud Build: build -> Artifact Registry -> Cloud Run. Nothing secret in here (names only).
# dev trigger (push develop): defaults below.
# prod trigger (push main, with "require approval"): override
#   _SERVICE=rafael  (and _MIN/_MAX if decided differently)
substitutions:
  _REGION: asia-southeast1
  _SERVICE: rafael-dev
  _REPO: rafael # Artifact Registry repo, same region
  _MIN: '1' # PROPOSAL Q2 (not decided): min = max = 1 for sprint 1, in-memory sessions
  _MAX: '1' # PROPOSAL Q2: >1 breaks resume (session affinity is best effort)
  _EXTENSION_IDS: '' # chrome-extension ids (not secret), comma separated, set on the trigger
  _SECRETS: DEEPGRAM_API_KEY=DEEPGRAM_API_KEY:latest # ENV=SecretName:version, comma separated

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/server/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$COMMIT_SHA', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$COMMIT_SHA']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/server:$COMMIT_SHA
      - --region=${_REGION}
      - --port=8080
      - --timeout=3600 # WS is cut at 60 min, client reconnects + resumes
      - --session-affinity
      - --min-instances=${_MIN}
      - --max-instances=${_MAX}
      - --allow-unauthenticated # auth is the Google token in WS hello (D13/D19); /api/health is open (D18)
      - --set-env-vars=^@^EXTENSION_IDS=${_EXTENSION_IDS}
      - --set-secrets=${_SECRETS}
      - --startup-probe=httpGet.path=/api/health,httpGet.port=8080
      - --liveness-probe=httpGet.path=/api/health,httpGet.port=8080

options:
  logging: CLOUD_LOGGING_ONLY
